<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Galeria Multimedialna MF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-overlay">
            <h1>Moja Galeria Multimedialna</h1>
        </div>
    </header>

    <main>
        <nav class="sticky-nav">
            <a href="#obrazy">Obrazy</a>
            <a href="#video">Wideo</a>
            <a href="#audio">Audio</a>
            <a href="#mapa">Lokalizacja</a>
        </nav>

        <section id="obrazy">
            <h2>Galeria Zdjęć</h2>
            <div class="gallery-grid">
                
                <div class="media-card">
                        <img src="https://picsum.photos/id/10/400/300" alt="Góry" width="400" height="300" loading="lazy">
                    </a>
                    <div class="hover-overlay">Powiększ</div>
                </div>

                <div class="media-card">
                    <img src="https://picsum.photos/id/20/400/300" alt="Obraz 2" width="400" height="300">
                </div>

                <div class="media-card">
                    <img src="https://picsum.photos/id/30/400/300" alt="Obraz 3" width="400" height="300">
                </div>

                <figure class="media-card">
                    <img src="https://picsum.photos/id/40/400/300" alt="Jesień" width="400" height="300">
                </figure>

                <figure class="media-card">
                    <img src="https://picsum.photos/id/50/400/300" alt="Natura" width="400" height="300">
                </figure>
            </div>
        </section>

        <section id="video">
            <h2>Prezentacje Wideo</h2>
            <div class="video-container">
                <video controls width="100%" poster="https://picsum.photos/id/1/800/450">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    <source src="https://www.w3schools.com/html/mov_bbb.ogg" type="video/ogg">
                </video>
            </div>
        </section>

       <section id="audio">
            <h2>Odtwarzacz Audio</h2>
            <audio controls>
                <source src="https://actions.google.com/sounds/v1/ambiences/forest_daybreak.ogg" type="audio/ogg">
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            </audio>
        </section>

        <section id="mapa">
            <h2>Nasza Lokalizacja: Niebieszczany</h2>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10334.863148387062!2d22.1466657!3d49.5284459!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x473c0903823f6699%3A0xc07883d6448378d3!2sNiebieszczany!5e0!3m2!1spl!2spl!4v1700000000000" 
                width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" 
                title="Mapa Niebieszczany">
            </iframe>
        </section>
    </main>

    <div id="img1" class="lightbox">
        <a href="#" class="lightbox-close">×</a>
        <img src="https://picsum.photos/id/10/800/600" alt="Powiększenie">
    </div>

    <a href="#" class="back-to-top">TOP</a>
<script src="script.js"></script>
    </body>
</html>
